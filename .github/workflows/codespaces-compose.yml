name: ReplyTrail Compose smoke test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-check:
    name: UI build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Build UI
        run: npm run build --prefix ui

      - name: Lint UI
        run: npm run lint --prefix ui

  compose-smoke:
    name: Docker Compose startup smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGRES_DB: alert_ops_ci
      POSTGRES_USER: alertops_ci
      POSTGRES_PASSWORD: alertops-ci-only-password
      RABBITMQ_USER: alertops_ci
      RABBITMQ_PASSWORD: alertops-ci-only-password
      REDIS_PASSWORD: alertops-ci-only-password
      ALERTOPS_CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_HOST_PORT: "8096"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Generate ephemeral JWT secret
        run: echo "JWT_SECRET_BASE64=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Start Compose stack from source
        run: docker compose up --build --detach

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 36); do
            if curl --fail --silent http://localhost:8096/actuator/health/liveness >/dev/null; then
              curl --fail --silent http://localhost:8096/actuator/health/readiness >/dev/null
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color --tail=200 app postgres rabbitmq redis
          exit 1

      - name: Collect Compose state and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 app postgres rabbitmq redis

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
