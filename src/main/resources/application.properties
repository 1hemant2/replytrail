# Common configuration. Local source runs use dev; deployments set prod through
# SPRING_PROFILES_ACTIVE in the container or process environment.
spring.application.name=alertops

# Load the ignored local .env when running from the repository or an IDE.
# Production deployments continue to provide these values as environment variables.
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Required secret. Supply JWT_SECRET_BASE64 through the environment.
security.jwt.secret-base64=${JWT_SECRET_BASE64}

# One-time workflow intents are shared through Redis and expire automatically.
alertops.intent.ttl=${INTENT_CACHE_TTL:10m}
alertops.cors.allowed-origins=${ALERTOPS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Spring Mail reads SMTP connection details from the standard SPRING_MAIL_* environment variables.
# This lets the app start without SMTP configured; notification attempts then fail visibly in saved state.
alertops.email.from=${ALERTOPS_EMAIL_FROM:}
alertops.webhook.max-body-bytes=${ALERTOPS_WEBHOOK_MAX_BODY_BYTES:65536}
alertops.webhook.rate-limit=${ALERTOPS_WEBHOOK_RATE_LIMIT:120}
alertops.ui.base-url=${ALERTOPS_UI_BASE_URL:http://localhost:5173}
alertops.auth.email-verification-ttl=${ALERTOPS_EMAIL_VERIFICATION_TTL:30m}
alertops.escalation.acknowledgement-ttl=${ALERTOPS_ACKNOWLEDGEMENT_TTL:72h}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${ALERTOPS_EMAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${ALERTOPS_EMAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${ALERTOPS_EMAIL_WRITE_TIMEOUT:5000}

# Confirm RabbitMQ acceptance before clearing a step's pending-publication flag.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
alertops.messaging.publish-retry-delay=${ALERTOPS_PUBLISH_RETRY_DELAY:5s}

# In-memory scheduling and ready-work consumer settings. The timer limit bounds
# admitted active schedules; it does not reserve memory at startup.
alertops.scheduler.max-active-timers=${ALERTOPS_SCHEDULER_MAX_ACTIVE_TIMERS:10000}
alertops.scheduler.recovery-batch-size=${ALERTOPS_SCHEDULER_RECOVERY_BATCH_SIZE:10000}
alertops.scheduler.publication-threads=${ALERTOPS_SCHEDULER_PUBLICATION_THREADS:2}
alertops.scheduler.publication-queue-capacity=${ALERTOPS_SCHEDULER_PUBLICATION_QUEUE_CAPACITY:100}
alertops.scheduler.start-retry-delay=${ALERTOPS_SCHEDULER_START_RETRY_DELAY:5s}
# Number of retries after the initial scheduled-start attempt; exhausted rows become START_FAILED.
alertops.scheduler.start-max-retries=${ALERTOPS_SCHEDULER_START_MAX_RETRIES:3}
# Durable START_FAILED notification delivery is recovered from PostgreSQL after restart.
alertops.notifications.failure-retry-delay=${ALERTOPS_FAILURE_NOTIFICATION_RETRY_DELAY:5m}
alertops.notifications.failure-delivery-lease=${ALERTOPS_FAILURE_NOTIFICATION_DELIVERY_LEASE:1m}
spring.task.scheduling.pool.size=${ALERTOPS_SCHEDULER_THREADS:2}
spring.rabbitmq.listener.simple.concurrency=${ALERTOPS_RABBITMQ_CONSUMER_CONCURRENCY:1}
spring.rabbitmq.listener.simple.max-concurrency=${ALERTOPS_RABBITMQ_MAX_CONSUMER_CONCURRENCY:4}
spring.rabbitmq.listener.simple.prefetch=${ALERTOPS_RABBITMQ_PREFETCH:1}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${ALERTOPS_RABBITMQ_MAX_ATTEMPTS:5}
spring.rabbitmq.listener.simple.retry.initial-interval=${ALERTOPS_RABBITMQ_RETRY_INITIAL_INTERVAL:1s}
spring.rabbitmq.listener.simple.retry.multiplier=${ALERTOPS_RABBITMQ_RETRY_MULTIPLIER:2.0}
spring.rabbitmq.listener.simple.retry.max-interval=${ALERTOPS_RABBITMQ_RETRY_MAX_INTERVAL:10s}

# IntentCache uses StringRedisTemplate directly; no Redis repository interfaces exist.
spring.data.redis.repositories.enabled=false
